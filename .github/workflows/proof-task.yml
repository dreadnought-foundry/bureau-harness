# Thin trigger stub — pipeline logic lives in dreadnought-foundry/bureau-pipeline
# (reusable workflows; pinned to release tag @main; pipeline_ref must match the pin).
# REPO-AGNOSTIC: the onboarding CLI pushes this file verbatim.
#
# Installed 2026-10-07 (DRE-6034). The `proof_task_parses` rehearsal dispatches
# `proof-execute` here and asserts a job actually started. The stub rides `@main`
# because this sandbox proves bureau-pipeline commits before the `stable` channel
# advances to them, so it is never pinned to the channel it is proving.
name: Proof Task

on:
  repository_dispatch:
    types: [proof-execute]

# Per card, and a second dispatch for the same card queues behind the first —
# never cancels it (agent-task's DRE-2032 reasoning: a canceled run is a
# record half written).
concurrency:
  group: proof-${{ github.event.client_payload.identifier }}
  cancel-in-progress: false

# A reusable workflow can hold no more permission than the stub that calls it.
permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  call:
    uses: dreadnought-foundry/bureau-pipeline/.github/workflows/proof-task.yml@main
    # Secrets are mapped EXPLICITLY, one per line — inherit silently passes an
    # empty secrets store across the cross-org reusable-workflow boundary and
    # the critic aborts on an empty token (DRE-2131). No PROOF_ROLE_ARN: the
    # sandbox has no AWS proof role. No pool secrets: agent-task.yml, the stub
    # this one copies, maps none, and the rehearsal only asserts a job started
    # (reconcile.yml maps them because the sweep reads GitHub every 15 minutes).
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      BUREAU_APP_ID: ${{ secrets.BUREAU_APP_ID }}
      BUREAU_APP_PRIVATE_KEY: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
      BUREAU_QA_APP_ID: ${{ secrets.BUREAU_QA_APP_ID }}
      BUREAU_QA_APP_PRIVATE_KEY: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}
    with:
      # The sandbox seat, same line as agent-task.yml and reconcile.yml:
      # secrets.LINEAR_API_KEY in THIS repo is the bureau-sandbox key, so the
      # run's `linear-budget:` line must say `sandbox`, not the reusable's
      # `fleet` default.
      linear_identity: sandbox
      pipeline_ref: main
