# Thin trigger stub — pipeline logic lives in dreadnought-foundry/bureau-pipeline
# (reusable workflows; pinned to release tag @main; pipeline_ref must match the pin).
# REPO-AGNOSTIC except `max_wip`: 4 is the new-project default (agent-bureau
# itself runs 12). Tune it per repo once throughput is understood.
name: Reconcile

on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [reconcile]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  call:
    uses: dreadnought-foundry/bureau-pipeline/.github/workflows/reconcile.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      BUREAU_APP_ID: ${{ secrets.BUREAU_APP_ID }}
      BUREAU_APP_PRIVATE_KEY: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
      BUREAU_QA_APP_ID: ${{ secrets.BUREAU_QA_APP_ID }}
      BUREAU_QA_APP_PRIVATE_KEY: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}
      # The dispatch pool (DRE-4282), passed by name (DRE-4323). This map is
      # explicit rather than `secrets: inherit` (DRE-2131), so the six org-level
      # pool secrets never reached this sweep: it read GitHub through the first
      # worker bot alone, logged "no additional pool apps configured" on every
      # pass, and went red whenever that one bot's hourly allowance was spent —
      # while every product repo's sweep, in the same minute, read through a
      # bot with headroom and passed. All six are optional in the reusable
      # workflow: a missing pair shrinks the pool, and a probe that cannot mint
      # is skipped (continue-on-error), so this can only widen what the sweep
      # can read through, never break it.
      BUREAU_APP_ID_2: ${{ secrets.BUREAU_APP_ID_2 }}
      BUREAU_APP_PRIVATE_KEY_2: ${{ secrets.BUREAU_APP_PRIVATE_KEY_2 }}
      BUREAU_APP_ID_3: ${{ secrets.BUREAU_APP_ID_3 }}
      BUREAU_APP_PRIVATE_KEY_3: ${{ secrets.BUREAU_APP_PRIVATE_KEY_3 }}
      BUREAU_APP_ID_4: ${{ secrets.BUREAU_APP_ID_4 }}
      BUREAU_APP_PRIVATE_KEY_4: ${{ secrets.BUREAU_APP_PRIVATE_KEY_4 }}
    with:
      # The operator's Intake pen (INTAKE_HOLD): this sweep reads the PRODUCTION board, and
      # without this line it aged 130+ cards into the CEO's queue on 2026-09-09/10 while every
      # other sweep held (DRE-3579). Same line as the product repos' stubs.
      intake_hold: ${{ vars.INTAKE_HOLD }}
      # The sandbox seat (DRE-3622/DRE-3634): this sweep spends bureau-sandbox's own Linear hour,
      # not the fleet's. secrets.LINEAR_API_KEY in THIS repo is the bureau-sandbox key since
      # 2026-09-13; every product repo stays on the fleet seat and passes nothing here.
      linear_identity: sandbox
      pipeline_ref: main
      max_wip: "4"
