# Thin trigger stub — pipeline logic lives in dreadnought-foundry/bureau-pipeline
# (reusable workflows; pinned to release tag @main; pipeline_ref must match the pin).
# REPO-AGNOSTIC: the onboarding CLI pushes this file verbatim.
name: QA Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

concurrency:
  group: qa-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  call:
    uses: dreadnought-foundry/bureau-pipeline/.github/workflows/qa-review.yml@main
    with:
      pipeline_ref: main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      BUREAU_APP_ID: ${{ secrets.BUREAU_APP_ID }}
      BUREAU_APP_PRIVATE_KEY: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
      BUREAU_QA_APP_ID: ${{ secrets.BUREAU_QA_APP_ID }}
      BUREAU_QA_APP_PRIVATE_KEY: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}
