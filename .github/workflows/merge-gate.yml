# Thin trigger stub — pipeline logic lives in dreadnought-foundry/bureau-pipeline
# (reusable workflows; pinned to release tag @main; pipeline_ref must match the pin). The workflow_run list
# names THIS repo's own CI workflows by their `name:` — keep it byte-aligned
# with ci.yml's `name:` (the scaffold ships both as "CI"). If the CLI renames
# the CI workflow, it must update this list and medic.yml's in the same change.
name: Merge Gate

on:
  workflow_run:
    workflows: [CI, QA Review]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)evaluate
        required: true

permissions:
  contents: read
  actions: write  # dispatch agent-fix on DIRTY (qa-bot App has no Actions perms)

jobs:
  call:
    uses: dreadnought-foundry/bureau-pipeline/.github/workflows/merge-gate.yml@main
    with:
      pipeline_ref: main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      BUREAU_APP_ID: ${{ secrets.BUREAU_APP_ID }}
      BUREAU_APP_PRIVATE_KEY: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
      BUREAU_QA_APP_ID: ${{ secrets.BUREAU_QA_APP_ID }}
      BUREAU_QA_APP_PRIVATE_KEY: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}
