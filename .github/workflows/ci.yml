# The sandbox's OWN product CI — the one workflow here that is not a pipeline
# stub. It exists to put a green check run on every PR head, because the merge
# gate fail-closes to `wait` on a head with no non-review checks
# (bureau-pipeline docs/harness.md). Its steps exercise the sandbox's own
# package, nothing of the pipeline's.
#
# Triggers are the scaffold's (DRE-4280): `pull_request`, and `push` on main
# only. Until this change it fired on EVERY push, so each harness branch cost
# two identical runs of the same tree, and the branch-push half never woke
# anything: the gate listens only for `workflow_run.event == 'pull_request'`.
# Measured over 2026-09-01..2026-09-18: 3,448 branch-push runs — 41% of this
# workflow's own 8,345 runs, 14% of the repo's 24,660. The other 2,990 pushes
# are to `main` and stay. GitHub bills each job rounded up to a whole minute,
# so a 20-second job run a thousand times is a thousand minutes.
# tests/test_harness_proves_main.py pins this shape.
#
# DO NOT rename `name:` — merge-gate.yml's `workflow_run` list matches on it.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # Rides the scaffold's routing expression (agent-bureau
    # scaffold/customer-repo/.github/workflows/ci.yml), which names RunsOn here
    # since 2026-10-06 (DRE-5984), on the CEO's rule that no job runs on
    # GitHub's machines. From DRE-4280 it sat on ubuntu-latest because its
    # 300+ short runs a day would have flooded the Mac mini queue (38 jobs
    # waiting on 2026-09-18); RunsOn gives each job its own machine, so there
    # is no queue to flood. tests/test_harness_proves_main.py pins this line.
    runs-on: ${{ fromJSON(vars.BUREAU_CI_RUNS_ON || vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" && pytest -q
