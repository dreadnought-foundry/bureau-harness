# The sandbox's OWN product CI — the one workflow here that is not a pipeline
# stub. It exists to put a green check run on every PR head, because the merge
# gate fail-closes to `wait` on a head with no non-review checks
# (bureau-pipeline docs/harness.md). Nothing in it is under test.
#
# Triggers are the scaffold's (DRE-4280): `pull_request`, and `push` on main
# only. Until 2026-09-18 this fired on EVERY push, so each harness branch cost
# two identical runs of the same tree — 76% of the 24,500 runs September
# billed — and the branch-push half never woke anything: the gate listens only
# for `workflow_run.event == 'pull_request'`. GitHub bills each job rounded up
# to a whole minute, so a 20-second job run a thousand times is a thousand
# minutes. tests/test_harness_proves_main.py pins this shape.
#
# DO NOT rename `name:` — merge-gate.yml's `workflow_run` list matches on it.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # Stays on GitHub-hosted ubuntu-latest — deliberately NOT the scaffold's
    # `fromJSON(vars.BUREAU_CI_RUNS_ON || vars.BUREAU_RUNS_ON || …)` expression
    # that routes fleet CI onto the Mac minis (DRE-4280). Each job here is
    # ~0.3 minutes, but there are 300+ a day, and that flood would land in a
    # queue that already serialises (38 jobs waiting on 2026-09-18). Moving it
    # is a decision, not a drive-by: tests/test_harness_proves_main.py fails
    # the moment this line changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" && pytest -q
